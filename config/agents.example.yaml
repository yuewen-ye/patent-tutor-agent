# config/agents.yaml — 全节点经 jiji.cc 聚合网关（2026-08-18 迁移为自定义通道）
# ============================================================================
# 网关：jiji.cc https://api.jiji.cc/v1
# 三个自定义通道（provider 名完全自定义，通道自带 base_url / api_key_env）：
#   jiji-gpt      api_key_env: GPT_API_KEY      → gpt-5.6-terra / gpt-5.6-luna / gpt-5.4-mini
#   jiji-deepseek api_key_env: DEEPSEEK_API_KEY → deepseek-v4-flash / deepseek-v4-pro
#   jiji-grok     api_key_env: GROK_API_KEY     → grok-4.5 / grok-4.6
# 节点 → 通道 → 模型（用户指定映射）：
#   route          → jiji-gpt      gpt-5.4-mini
#   chat_answer    → jiji-gpt      gpt-5.4-mini
#   planner        → jiji-deepseek deepseek-v4-flash
#   diagnosis      → jiji-deepseek deepseek-v4-flash
#   expert_a       → jiji-grok     grok-4.5
#   expert_b       → jiji-gpt      gpt-5.4-mini（fallback deepseek-v4-pro）
#   judge          → jiji-gpt      gpt-5.6-terra（per-agent 覆盖；luna 在 jiji.cc 曾 503）
#   generate_pptx  → ooio-gpt2     gpt-5.6-terra（生成完整 PPT 版式 JSON，后端渲染 .pptx）
# 三系列异构：expert_a=grok(xAI) / expert_b=gpt / judge=gpt(OpenAI)
# jiji-gpt 保持 supports_strict_schema=true：jiji.cc 拒绝 strict 时返回 400（在项目兜底集合
#   {400,404,415,422} 内），系统首调撞 400 自动降级 json_object + schema 注入；其余通道为 false。
# ============================================================================

llm:
  default_provider: jiji-deepseek
  timeout_seconds: 90
  retry_times: 3

providers:
  jiji-gpt:
    base_url: https://api-slb.jiji.cc/v1
    api_key_env: JIJI_GPT_API_KEY
    model_name: gpt-5.4-mini
    supports_strict_schema: true
  jiji-deepseek:
    base_url: https://api-slb.jiji.cc/v1
    api_key_env: JIJI_DEEPSEEK_API_KEY
    model_name: deepseek-v4-flash
    supports_strict_schema: false
  jiji-grok:
    base_url: https://api-slb.jiji.cc/v1
    api_key_env: JIJI_GROK_API_KEY
    model_name: grok-4.5
    supports_strict_schema: true
  ooio-gpt1:
    base_url: https://ooioo.work/v1
    api_key_env: OOIO_GPT1_API_KEY
    model_name: gpt-5.4
    supports_strict_schema: true
  ooio-gpt2:
    base_url: https://ooioo.work/v1
    api_key_env: OOIO_GPT2_API_KEY
    model_name: gpt-5.6-terra
    supports_strict_schema: true

agents:
  route:
    provider: jiji-gpt
    temperature: 0.0
    fallback_provider: jiji-deepseek
    fallback_model_name: deepseek-v4-flash
  diagnosis_feedback:
    provider: ooio-gpt1
    temperature: 0.5
    fallback_provider: jiji-gpt
    fallback_model_name: gpt-5.4-mini
  expert_a:
    provider: ooio-gpt2
    temperature: 0.4
    tool_temperature: 0.2
    integration_temperature: 0.3
    top_k: 8
    fallback_provider: jiji-deepseek
    fallback_model_name: deepseek-v4-pro
  expert_b:
    provider: ooio-gpt1
    temperature: 0.7
    tool_temperature: 0.3
    top_k: 8
    fallback_provider: jiji-deepseek
    fallback_model_name: deepseek-v4-pro
  judge:
    provider: ooio-gpt2
    temperature: 0.0
    max_revisions: 0   
    fallback_provider: jiji-deepseek
    fallback_model_name: deepseek-v4-pro
  chat_answer: 
    provider: ooio-gpt1
    temperature: 0.3
    top_k: 5
    fallback_provider: jiji-deepseek
    fallback_model_name: deepseek-v4-flash
  planner:
    provider: ooio-gpt2
    temperature: 0.0
    fallback_provider: jiji-gpt
    fallback_model_name: gpt-5.4-mini
  slide_deck:
    provider: jiji-grok
    temperature: 0.3
    fallback_provider: jiji-deepseek
    fallback_model_name: deepseek-v4-flash
  generate_pptx:
    provider: ooio-gpt2
    temperature: 0.2
    fallback_provider: jiji-gpt
    fallback_model_name: gpt-5.4-mini
