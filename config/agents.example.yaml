# Copy this file to config/agents.yaml before the first local run:
#   Copy-Item config/agents.example.yaml config/agents.yaml
#
# config/agents.yaml is intentionally ignored by Git. Keep API keys in .env,
# and tune local provider endpoints, models, and per-agent settings there.
#
# ============================ 模型更新日志 ===============================
# 2026.08 主力 provider 统一走 GreatRouter 端点（https://endpoint.greatrouter.com）+ 单 key：
#   - provider 全集与代码 LLMProvider 对齐：qwen / glm / gpt / luna / grok / yangmao / mistral / minimax / deepseek
#   - qwen/glm/gpt/luna/grok/mistral/minimax/deepseek 全部 base_url=https://endpoint.greatrouter.com，
#     key 见 .env 的 *_API_KEY（均为同一 GreatRouter key）
#   - 可用模型：gpt-5.5 / gpt-5.6-luna / grok-4.3 / qwen3.7-plus / GLM-5.2 / mistral-small-2503 / MiniMax-M2.5 / DeepSeek-V4-Flash
#   - yangmao 保留原 DeepSeek Flash 通道（yangmao-main，独立 base_url/key），
#     需要请求 DeepSeek 时通过 {AGENT}_PROVIDER=yangmao 或 agents.<agent>.provider 使用
#   - 建议避免在输出内容较多的节点使用弱推理模型，防止网关超时

llm:
  default_provider: grok
  timeout_seconds: 90
  retry_times: 3

providers:
  qwen:
    model_name: Qwen3.7-Plus
    base_url: https://endpoint.greatrouter.com
    supports_strict_schema: true
  glm:
    model_name: GLM-5.2
    base_url: https://endpoint.greatrouter.com
    supports_strict_schema: true
  gpt:
    model_name: gpt-4o
    base_url: https://endpoint.greatrouter.com
    supports_strict_schema: true
  luna:
    model_name: gpt-5.6-luna
    base_url: https://endpoint.greatrouter.com
    supports_strict_schema: true
  grok:
    model_name: grok-4.3
    base_url: https://endpoint.greatrouter.com
    supports_strict_schema: true
  terra:
    model_name: gpt-5.6-terra
    base_url: https://endpoint.greatrouter.com
    supports_strict_schema: true
  yangmao:
    model_name: yangmao-main
    base_url: https://ai.gz404.com:54002/v1
    supports_strict_schema: true
  mistral:
    model_name: mistral-small-2503
    base_url: https://endpoint.greatrouter.com
    supports_strict_schema: true
  minimax:
    model_name: MiniMax-M2.5
    base_url: https://endpoint.greatrouter.com
    supports_strict_schema: true
  deepseek:
    model_name: DeepSeek-V4-Flash
    base_url: https://endpoint.greatrouter.com
    supports_strict_schema: true

# 推荐 Agent → provider 映射（按 GreatRouter 节点分配表）：
#
# 可选 fallback（模型侧故障转移）：agents.<agent> 下加 fallback_model_name 即启用。
# 主模型遇到模型侧错误（429/5xx/524、传输错误、空/坏响应）时，自动切到 fallback
# 模型试一次；fallback 也失败则回到主模型进入下一轮，轮数由 llm.retry_times 控制。
# 400（schema 被拒）/401/403（key 问题）属于我方问题，不触发 fallback。
#   fallback_provider: gpt            # 可选，缺省 = 该 Agent 的主 provider（复用其 key/base_url）
#   fallback_model_name: gpt-5.5      # 必填（不配则不启用 fallback）
#   fallback_base_url: https://...    # 可选，覆盖 fallback provider 解析出的 base_url
agents:
  route:
    provider: mistral
    temperature: 0.0
    fallback_provider: qwen
    fallback_model_name: Qwen3.7-Plus
  diagnosis_feedback:
    provider: deepseek
    temperature: 0.5
    fallback_provider: qwen
    fallback_model_name: Qwen3.7-Plus
  expert_a:
    provider: grok
    temperature: 0.4
    tool_temperature: 0.2
    integration_temperature: 0.3
    top_k: 5
    fallback_provider: deepseek
    fallback_model_name: DeepSeek-V4-Pro
  expert_b:
    provider: deepseek
    model_name: DeepSeek-V4-Pro
    fallback_provider: gpt
    fallback_model_name: gpt-5.5
    temperature: 0.7
    tool_temperature: 0.3
    top_k: 5
  judge:
    provider: gpt
    model_name: gpt-5.6-luna
    temperature: 0.0
    fallback_provider: deepseek
    fallback_model_name: DeepSeek-V4-Pro
  chat_answer:
    provider: minimax
    temperature: 0.3
    top_k: 5
    fallback_provider: qwen
    fallback_model_name: Qwen3.7-Plus
  planner:
    provider: deepseek
    temperature: 0.0
    fallback_provider: gpt
    fallback_model_name: gpt-5.5
  slide_deck:
    provider: grok
    temperature: 0.3
    fallback_provider: deepseek
    fallback_model_name: DeepSeek-V4-Flash
