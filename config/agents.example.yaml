# Copy this file to config/agents.yaml before the first local run:
#   Copy-Item config/agents.example.yaml config/agents.yaml
#
# config/agents.yaml is intentionally ignored by Git. Keep API keys in .env,
# and tune local provider endpoints, models, and per-agent settings there.

llm:
  default_provider: deepseek
  timeout_seconds: 90
  retry_times: 3

providers:
  deepseek:
    model_name: deepseek-v4-flash
    base_url: https://api.deepseek.com
  qwen:
    model_name: qwen3.7-max-2026-05-17
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  glm:
    model_name: glm-5.2
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

agents:
  route:
    provider: deepseek
    temperature: 0.0
  diagnosis_feedback:
    provider: deepseek
    temperature: 0.5
  expert_a:
    provider: deepseek
    temperature: 0.4
    tool_temperature: 0.2
    integration_temperature: 0.3
    top_k: 5
  expert_b:
    provider: deepseek
    temperature: 0.7
    tool_temperature: 0.3
    top_k: 5
  judge:
    provider: deepseek
    temperature: 0.0
  chat_answer:
    provider: deepseek
    temperature: 0.3
    top_k: 5
