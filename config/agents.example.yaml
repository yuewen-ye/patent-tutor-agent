# Copy this file to config/agents.yaml before the first local run:
#   Copy-Item config/agents.example.yaml config/agents.yaml
#
# config/agents.yaml is intentionally ignored by Git. Keep API keys in .env,
# and tune local provider endpoints, models, and per-agent settings there.
#
# ============================ 模型更新日志 ===============================
# 2026.08 后端 provider 重构（backend/app/core/llm.py DEFAULT_CONFIG 为准）：
#   - provider 全集与代码 LLMProvider 对齐：deepseek / deepseek_pro / grok / gpt / mistral / minimax
#   - deepseek / deepseek_pro / gpt / mistral / minimax 统一走 greatrouter 单端点 + 单 key
#     （api_key_env=DEEPSEEK_API_KEY）；grok 走 KRILL_API_KEY / KRILL_BASE_URL
#   - 已从代码删除：qwen / glm / luna / terra / yangmao，模板不再列出
#   - 建议避免在输出内容较多的节点使用弱推理模型，防止网关超时

llm:
  default_provider: deepseek
  timeout_seconds: 90
  retry_times: 3

providers:
  deepseek:
    model_name: DeepSeek-V4-Flash
    base_url: https://endpoint.greatrouter.com/v1
    supports_strict_schema: false
  deepseek_pro:
    model_name: DeepSeek-V4-Pro
    base_url: https://endpoint.greatrouter.com/v1
    supports_strict_schema: false
  grok:
    model_name: grok-4.5
    base_url: https://api-slb.krill-ai.net/codex/v1
    supports_strict_schema: false
  gpt:
    model_name: gpt-5.6-luna
    base_url: https://endpoint.greatrouter.com/v1
    supports_strict_schema: false
  mistral:
    model_name: mistral-small-2503
    base_url: https://endpoint.greatrouter.com/v1
    supports_strict_schema: false
  minimax:
    model_name: MiniMax-M2.5
    base_url: https://endpoint.greatrouter.com/v1
    supports_strict_schema: false

# 推荐 Agent → provider 映射（对齐 llm.py 注释；可在本机 config/agents.yaml 调整）：
#   route=mistral / chat_answer=minimax / planner+diagnosis=deepseek /
#   expert_b=deepseek_pro / expert_a=grok / judge=gpt
agents:
  route:
    provider: mistral
    temperature: 0.0
  diagnosis_feedback:
    provider: deepseek
    temperature: 0.5
  expert_a:
    provider: grok
    temperature: 0.4
    tool_temperature: 0.2
    integration_temperature: 0.3
    top_k: 5
  expert_b:
    provider: deepseek_pro
    temperature: 0.7
    tool_temperature: 0.3
    top_k: 5
  judge:
    provider: gpt
    temperature: 0.0
  chat_answer:
    provider: minimax
    temperature: 0.3
    top_k: 5
  planner:
    provider: deepseek
    temperature: 0.0
