# Copy this file to config/agents.yaml before the first local run:
#   Copy-Item config/agents.example.yaml config/agents.yaml
#
# config/agents.yaml is intentionally ignored by Git. Keep API keys in .env,
# and tune local provider endpoints, models, and per-agent settings there.

  ## 请尽可能避免在输出内容较多的节点中使用 qwen/glm ，可能会导致 Gateway Timeout 发生
  
  ## ============================ 模型更新日志 ===============================
  ## 2026.08.06 更新:   glm 更新状态【不可使用】,请及时更换使用 glm 作为 provider 的节点;
  ##                    grok 更新状态【可使用】
  ##            新增:   yangmao 模型为 Deepseek Flash

llm:
  default_provider: deepseek
  timeout_seconds: 90
  retry_times: 3

providers:
  deepseek:
    model_name: deepseek-v4-flash
    base_url: https://api.deepseek.com
    supports_strict_schema: false
  qwen:
    model_name: qwen3.7-plus
    base_url: https://api-slb.krill-ai.net/codex/v1
    supports_strict_schema: false
  glm:
    model_name: glm-5.2
    base_url: https://api-slb.krill-ai.net/codex/v1
    supports_strict_schema: false
  gpt:
    model_name: gpt-5.5
    base_url: https://api-slb.krill-ai.net/codex/v1
    supports_strict_schema: false
  luna:
    model_name: gpt-5.6-luna
    base_url: https://api-slb.krill-ai.net/codex/v1
    supports_strict_schema: false
  terra:
    model_name: gpt-5.6-terra
    base_url: https://api-slb.krill-ai.net/codex/v1
    supports_strict_schema: false
  grok:
    model_name: grok-4.5
    base_url: https://api-slb.krill-ai.net/codex/v1
    supports_strict_schema: false
  yangmao:
    model_name: yangmao-main
    base_url: https://ai.gz404.com:54002/v1
    supports_strict_schema: false



agents:
  route:
    provider: deepseek
    temperature: 0.0
  diagnosis_feedback:
    provider: deepseek
    temperature: 0.5
  expert_a:
    provider: deepseek
    temperature: 0.4
    tool_temperature: 0.2
    integration_temperature: 0.3
    top_k: 5
  expert_b:
    provider: deepseek
    temperature: 0.7
    tool_temperature: 0.3
    top_k: 5
  judge:
    provider: deepseek
    temperature: 0.0
  chat_answer:
    provider: deepseek
    temperature: 0.3
    top_k: 5
  planner:
    provider: deepseek
    temperature: 0.0
